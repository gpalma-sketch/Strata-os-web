<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>os-aprobar-en</title>
<link rel="stylesheet" href="fonts/gf.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:143px;overflow:hidden;background:#F4F6F3}
  /* design space = 2000 x 286, scaled to half so DSF2 yields 1:1 device px */
  #stage{
    position:absolute;top:0;left:0;
    width:2000px;height:286px;
    transform:scale(.5);transform-origin:top left;
    background:#F4F6F3;
    font-family:'Space Grotesk',system-ui,sans-serif;
    color:#11150F;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:'Space Mono','SFMono-Regular',monospace}

  /* ---------- sidebar ---------- */
  #side{position:absolute;left:0;top:0;width:300px;height:286px;background:#fff;}
  #side:after{content:'';position:absolute;right:0;top:0;width:2px;height:286px;background:rgba(17,21,15,.10)}
  .row{position:absolute;left:0;width:300px;height:44px;display:flex;align-items:center;}
  .row .ic{position:absolute;left:26px;width:26px;height:26px;color:#3E4A41;display:flex;align-items:center;justify-content:center}
  .row .tx{position:absolute;left:64px;font-size:17.5px;font-weight:400;letter-spacing:-.005em;color:#232B25}
  .pill-a{
    position:absolute;display:flex;align-items:center;justify-content:center;
    background:rgba(176,125,26,.14);color:#B07D1A;border-radius:999px;
    font-size:15px;font-weight:500;
  }
  .sec{position:absolute;left:28px;font-size:11px;letter-spacing:.12em;color:#7A857C;text-transform:uppercase}

  .active{background:#E9F3EB;border-radius:0 12px 12px 0;}
  .active .bar{position:absolute;left:0;top:0;width:6px;height:100%;background:#0B8A74;border-radius:0 3px 3px 0}
  .active .tx{font-weight:700;color:#11150F}
  .active .ic{color:#11150F}

  /* ---------- panel ---------- */
  .card{position:absolute;background:#fff;border:2px solid rgba(17,21,15,.10);border-radius:24px}

  #cardTop{left:376px;top:-64px;width:1700px;height:86px}
  #cardBot{left:376px;top:270px;width:1700px;height:120px}

  #cardMain{left:376px;top:54px;width:1700px;height:186px}

  #title{position:absolute;left:56px;top:22px;font-size:19px;font-weight:500;letter-spacing:-.01em;color:#11150F}
  #titleIcon{position:absolute;left:22px;top:20px;width:26px;height:26px;color:#0B8A74}
  #capRight{position:absolute;left:1540px;top:27px;font-size:11px;letter-spacing:.12em;color:#8B948C;white-space:nowrap;text-transform:uppercase}

  .dep{position:absolute;top:80px;height:80px;border:2px solid rgba(17,21,15,.10);border-radius:20px}
  .dep .box{position:absolute;left:14px;top:12px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .dep .box svg{width:24px;height:24px}
  .dep .nm{position:absolute;left:84px;top:24px;font-size:18px;font-weight:700;letter-spacing:-.012em;color:#11150F}
  .dep .sub{position:absolute;left:84px;top:52px;font-size:12px;letter-spacing:.12em;color:#79837B;text-transform:uppercase;white-space:nowrap}
  .dep .cnt{position:absolute;top:24px;display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:999px;background:rgba(176,125,26,.14);color:#B07D1A;font-size:16px;font-weight:500}
  .dep .cnt i{width:9px;height:9px;border-radius:50%;background:#D9A22E;display:block}
</style>
</head>
<body>
<div id="stage">

  <!-- ============ SIDEBAR ============ -->
  <div id="side">
    <div class="row" style="top:14px">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v1"/><path d="M3 7.5V17a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 0 0-1-1H5.5A2.5 2.5 0 0 1 3 7.5Z"/><circle cx="16.5" cy="14" r="1.1"/></svg></span>
      <span class="tx">Finance</span>
      <span class="pill-a" style="left:252px;top:9px;width:34px;height:26px">1</span>
    </div>

    <div class="row" style="top:61px">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="3" y="3" width="7.5" height="6" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="6" rx="1.6"/><rect x="3" y="13" width="7.5" height="8" rx="1.6"/><rect x="13.5" y="13" width="7.5" height="8" rx="1.6"/></svg></span>
      <span class="tx">Product &amp; Dev</span>
    </div>

    <div class="row" style="top:108px">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="9" cy="8" r="3.2"/><path d="M3.2 19.4a6 6 0 0 1 11.6 0"/><path d="M16.2 5.4a3 3 0 0 1 0 5.4"/><path d="M17.6 14.6a5.4 5.4 0 0 1 3.2 4.4"/></svg></span>
      <span class="tx">People</span>
    </div>

    <div class="row" style="top:155px">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="6.4" r="3"/><circle cx="6" cy="16.4" r="3"/><circle cx="18" cy="16.4" r="3"/><path d="M10.4 9.1 7.6 13.8M13.6 9.1l2.8 4.7M9 16.4h6"/></svg></span>
      <span class="tx">Ops</span>
    </div>

    <div class="sec mono" style="top:218px">Your AI team</div>

    <div class="row active" style="top:245px;height:44px">
      <span class="bar"></span>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><rect x="3.5" y="7.5" width="17" height="12" rx="3"/><path d="M12 3.4v4.1"/><circle cx="8.6" cy="13.4" r="1.15"/><circle cx="15.4" cy="13.4" r="1.15"/></svg></span>
      <span class="tx">Your AI team</span>
    </div>
  </div>

  <!-- ============ PANEL ============ -->
  <div class="card" id="cardTop"></div>

  <div class="card" id="cardMain">
    <div id="titleIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M9 4.2H7.2A2.2 2.2 0 0 0 5 6.4v12.4A2.2 2.2 0 0 0 7.2 21h9.6a2.2 2.2 0 0 0 2.2-2.2V6.4a2.2 2.2 0 0 0-2.2-2.2H15"/><rect x="9" y="2.6" width="6" height="3.4" rx="1.1"/><path d="m9.4 13.2 1.9 1.9 3.4-3.7"/></svg></div>
    <div id="title">Approvals by department</div>
    <div id="capRight" class="mono">Each one in one place</div>

    <!-- Marketing -->
    <div class="dep" style="left:24px;width:586px;background:#FFFFFF">
      <div class="box" style="background:#F6EBE7;color:#C0553A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.6v3.6a1.8 1.8 0 0 0 1.8 1.8h1.9L14.5 19V5.2L7.7 9.6H5.8A1.8 1.8 0 0 0 4 9.6Z"/><path d="M17.6 9.2a3.4 3.4 0 0 1 0 5.8"/><path d="m7.7 15 .9 4.6"/></svg></div>
      <div class="nm">Marketing &amp; Growth</div>
      <div class="sub mono">Review and approve →</div>
      <div class="cnt" style="left:518px"><i></i>4</div>
    </div>

    <!-- Sales -->
    <div class="dep" style="left:626px;width:584px;background:#FBFCFA">
      <div class="box" style="background:#E3F3EE;color:#0B8A74"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 12.2 6 8.9a2 2 0 0 1 1.5-.6h2.2l2 1.9a1.5 1.5 0 0 0 2.1 0l.5-.5"/><path d="m11.2 13.6 2.2 2.1a1.4 1.4 0 0 0 2-2l-2.2-2.1"/><path d="M21.2 12.2 18 8.9a2 2 0 0 0-1.5-.6H14"/><path d="m8.4 13.6-1.7 1.7a1.4 1.4 0 0 0 2 2l1.7-1.7"/></svg></div>
      <div class="nm">Sales</div>
      <div class="sub mono">Review and approve →</div>
      <div class="cnt" style="left:516px"><i></i>1</div>
    </div>

    <!-- Finance (cut off by the right edge) -->
    <div class="dep" style="left:1226px;width:586px;background:#FBFCFA">
      <div class="box" style="background:#F4EFE2;color:#A8791F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 7.6A2.4 2.4 0 0 1 5.8 5.2h11.5a2 2 0 0 1 2 2v1"/><path d="M3.4 7.6v9.2a2.2 2.2 0 0 0 2.2 2.2h13.2a1.6 1.6 0 0 0 1.6-1.6v-5.6a1 1 0 0 0-1-1H5.8a2.4 2.4 0 0 1-2.4-2.2Z"/><circle cx="16.4" cy="14" r="1.1"/></svg></div>
      <div class="nm">Finance</div>
      <div class="sub mono">Review and approve →</div>
      <div class="cnt" style="left:518px"><i></i>2</div>
    </div>
  </div>

  <div class="card" id="cardBot"></div>
</div>
</body>
</html>
